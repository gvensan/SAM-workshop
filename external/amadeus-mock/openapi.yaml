openapi: 3.0.3

info:
  title: Amadeus Travel API Mock
  description: |
    Mock implementation of the [Amadeus Self-Service APIs](https://developers.amadeus.com).

    ## Authentication
    All endpoints (except `/v1/security/oauth2/token` and `/health`) require a Bearer token.

    **Steps:**
    1. `POST /v1/security/oauth2/token` with `client_id=test`, `client_secret=test`, `grant_type=client_credentials`
    2. Use the returned `access_token` as `Authorization: Bearer <token>`

    Set env var `REQUIRE_AUTH=false` to skip token checks entirely (quick demos).

    ## Supported Routes (Flights)
    | Origin | Destination | Airlines |
    |--------|-------------|----------|
    | SIN    | LHR         | SQ, BA, EK |
    | SIN    | SYD         | SQ, QF |
    | SIN    | HND         | SQ, JL |
    | SIN    | BKK         | SQ, TK |
    | JFK    | LAX         | AA, UA |
    | LHR    | CDG         | BA, AF |
    | DXB    | SIN         | EK, SQ |
    | HKG    | LHR         | CX, BA |

    ## Supported Cities (Hotels)
    SIN · LON · NYC · SYD · DXB · PAR · TYO

  version: "1.0.0"
  contact:
    name: Workshop Support

servers:
  - url: http://localhost:8080
    description: Local Docker instance

tags:
  - name: Auth
    description: OAuth2 token management
  - name: Flights
    description: Flight search and booking
  - name: Hotels
    description: Hotel search and booking
  - name: Health
    description: Service health

# ---------------------------------------------------------------------------
# Security scheme
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Bearer token obtained from POST /v1/security/oauth2/token"

  # -------------------------------------------------------------------------
  # Shared schemas
  # -------------------------------------------------------------------------
  schemas:

    # --- Error envelope -------------------------------------------------------
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      properties:
        status:
          type: integer
          example: 400
        code:
          type: integer
          example: 32171
        title:
          type: string
          example: MANDATORY DATA MISSING
        detail:
          type: string
          example: Missing mandatory field

    # --- Auth -----------------------------------------------------------------
    TokenResponse:
      type: object
      properties:
        type:
          type: string
          example: amadeusOAuth2Token
        username:
          type: string
          example: ws-with-test@amadeus-mock
        application_name:
          type: string
          example: AmadeusMock
        client_id:
          type: string
          example: test
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          example: AaxFD-Ih3Zs45vp_aS27nDdI90D6RF8iJqX9xku0oew
        expires_in:
          type: integer
          example: 1799
        state:
          type: string
          example: approved
        scope:
          type: string
          example: ""

    # --- Shared primitives ---------------------------------------------------
    Price:
      type: object
      properties:
        currency:
          type: string
          example: USD
        total:
          type: string
          example: "1172.91"
        base:
          type: string
          example: "1047.24"
        fees:
          type: array
          items:
            type: object
            properties:
              amount:
                type: string
              type:
                type: string
        grandTotal:
          type: string
          example: "1172.91"

    GeoCode:
      type: object
      properties:
        latitude:
          type: number
          format: double
          example: 1.2864
        longitude:
          type: number
          format: double
          example: 103.8534

    Address:
      type: object
      properties:
        lines:
          type: array
          items:
            type: string
          example: ["1 FULLERTON SQUARE"]
        postalCode:
          type: string
          example: "049178"
        cityName:
          type: string
          example: SINGAPORE
        countryCode:
          type: string
          example: SG

    # --- Flight schemas ------------------------------------------------------
    FlightSegment:
      type: object
      properties:
        departure:
          type: object
          properties:
            iataCode:
              type: string
              example: SIN
            terminal:
              type: string
              example: "3"
            at:
              type: string
              format: date-time
              example: "2026-10-15T01:30:00"
        arrival:
          type: object
          properties:
            iataCode:
              type: string
              example: LHR
            terminal:
              type: string
              example: "2"
            at:
              type: string
              format: date-time
              example: "2026-10-15T15:00:00"
        carrierCode:
          type: string
          example: SQ
        number:
          type: string
          example: "317"
        aircraft:
          type: object
          properties:
            code:
              type: string
              example: "359"
        operating:
          type: object
          properties:
            carrierCode:
              type: string
              example: SQ
        duration:
          type: string
          description: ISO 8601 duration
          example: PT13H30M
        id:
          type: string
          example: "1"
        numberOfStops:
          type: integer
          example: 0
        blacklistedInEU:
          type: boolean
          example: false

    FlightItinerary:
      type: object
      properties:
        duration:
          type: string
          example: PT13H30M
        segments:
          type: array
          items:
            $ref: '#/components/schemas/FlightSegment'

    TravelerPricing:
      type: object
      properties:
        travelerId:
          type: string
          example: "1"
        fareOption:
          type: string
          example: STANDARD
        travelerType:
          type: string
          enum: [ADULT, CHILD, HELD_INFANT, SEATED_INFANT, SENIOR]
          example: ADULT
        price:
          type: object
          properties:
            currency:
              type: string
            total:
              type: string
            base:
              type: string
            taxes:
              type: array
              items:
                type: object
                properties:
                  amount:
                    type: string
                  code:
                    type: string
        fareDetailsBySegment:
          type: array
          items:
            type: object
            properties:
              segmentId:
                type: string
              cabin:
                type: string
                enum: [ECONOMY, PREMIUM_ECONOMY, BUSINESS, FIRST]
              fareBasis:
                type: string
              brandedFare:
                type: string
              class:
                type: string
              includedCheckedBags:
                type: object
                properties:
                  quantity:
                    type: integer

    FlightOffer:
      type: object
      properties:
        type:
          type: string
          example: flight-offer
        id:
          type: string
          example: "1"
        source:
          type: string
          example: GDS
        instantTicketingRequired:
          type: boolean
          example: false
        nonHomogeneous:
          type: boolean
          example: false
        oneWay:
          type: boolean
          example: true
        lastTicketingDate:
          type: string
          format: date
          example: "2026-10-12"
        lastTicketingDateTime:
          type: string
          format: date-time
          example: "2026-10-12T23:59:00"
        numberOfBookableSeats:
          type: integer
          example: 9
        itineraries:
          type: array
          items:
            $ref: '#/components/schemas/FlightItinerary'
        price:
          $ref: '#/components/schemas/Price'
        pricingOptions:
          type: object
          properties:
            fareType:
              type: array
              items:
                type: string
            includedCheckedBagsOnly:
              type: boolean
        validatingAirlineCodes:
          type: array
          items:
            type: string
          example: [SQ]
        travelerPricings:
          type: array
          items:
            $ref: '#/components/schemas/TravelerPricing'

    FlightSearchResponse:
      type: object
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
              example: 3
            links:
              type: object
              properties:
                self:
                  type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/FlightOffer'
        dictionaries:
          type: object
          properties:
            locations:
              type: object
              additionalProperties:
                type: object
                properties:
                  cityCode:
                    type: string
                  countryCode:
                    type: string
            aircraft:
              type: object
              additionalProperties:
                type: string
            currencies:
              type: object
              additionalProperties:
                type: string
            carriers:
              type: object
              additionalProperties:
                type: string
              example:
                SQ: SINGAPORE AIRLINES
                BA: BRITISH AIRWAYS

    Traveler:
      type: object
      required: [id, dateOfBirth, name, contact]
      properties:
        id:
          type: string
          example: "1"
        dateOfBirth:
          type: string
          format: date
          example: "1990-04-14"
        name:
          type: object
          properties:
            firstName:
              type: string
              example: JOHN
            lastName:
              type: string
              example: DOE
        gender:
          type: string
          enum: [MALE, FEMALE, UNSPECIFIED, UNDISCLOSED]
          example: MALE
        contact:
          type: object
          properties:
            emailAddress:
              type: string
              format: email
              example: john.doe@example.com
            phones:
              type: array
              items:
                type: object
                properties:
                  deviceType:
                    type: string
                    example: MOBILE
                  countryCallingCode:
                    type: string
                    example: "65"
                  number:
                    type: string
                    example: "91234567"
        documents:
          type: array
          items:
            type: object
            properties:
              documentType:
                type: string
                example: PASSPORT
              birthPlace:
                type: string
              issuanceLocation:
                type: string
              issuanceDate:
                type: string
                format: date
              number:
                type: string
                example: "A12345678"
              expiryDate:
                type: string
                format: date
              issuanceCountry:
                type: string
                example: SG
              validityCountry:
                type: string
              nationality:
                type: string
                example: SG
              holder:
                type: boolean
                example: true

    FlightOrderRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, flightOffers, travelers]
          properties:
            type:
              type: string
              example: flight-order
            flightOffers:
              type: array
              description: One or more flight offers from /v2/shopping/flight-offers
              items:
                $ref: '#/components/schemas/FlightOffer'
            travelers:
              type: array
              items:
                $ref: '#/components/schemas/Traveler'
            remarks:
              type: object
              properties:
                general:
                  type: array
                  items:
                    type: object
                    properties:
                      subType:
                        type: string
                        example: GENERAL_MISCELLANEOUS
                      text:
                        type: string
            ticketingAgreement:
              type: object
              properties:
                option:
                  type: string
                  enum: [CONFIRM, DELAY_TO_CANCEL, DELAY_TO_QUEUE]
                  example: DELAY_TO_CANCEL
                delay:
                  type: string
                  example: 6D
            contacts:
              type: array
              items:
                type: object
                properties:
                  addresseeName:
                    type: object
                    properties:
                      firstName:
                        type: string
                      lastName:
                        type: string
                  companyName:
                    type: string
                  purpose:
                    type: string
                    enum: [STANDARD, INVOICE, STANDARD_WITHOUT_TRANSMISSION]
                  phones:
                    type: array
                    items:
                      type: object
                  emailAddress:
                    type: string
                  address:
                    $ref: '#/components/schemas/Address'

    AssociatedRecord:
      type: object
      properties:
        reference:
          type: string
          example: PNR4A2BCD
        creationDate:
          type: string
          example: "2026-08-20T10:00:00.000"
        originSystemCode:
          type: string
          example: GDS
        flightOfferId:
          type: string
          example: "1"

    FlightOrder:
      type: object
      properties:
        type:
          type: string
          example: flight-order
        id:
          type: string
          example: MOCK3F9A1B2C
        queuingOfficeId:
          type: string
          example: SINBA2222
        associatedRecords:
          type: array
          items:
            $ref: '#/components/schemas/AssociatedRecord'
        flightOffers:
          type: array
          items:
            $ref: '#/components/schemas/FlightOffer'
        travelers:
          type: array
          items:
            $ref: '#/components/schemas/Traveler'
        remarks:
          type: object
        ticketingAgreement:
          type: object
        contacts:
          type: array
          items:
            type: object

    # --- Hotel schemas -------------------------------------------------------
    HotelListEntry:
      type: object
      properties:
        type:
          type: string
          example: hotel
        hotelId:
          type: string
          example: ADSINFL1
        dupeId:
          type: string
          example: "700178314"
        name:
          type: string
          example: THE FULLERTON HOTEL SINGAPORE
        cityCode:
          type: string
          example: SIN
        countryCode:
          type: string
          example: SG
        iataCode:
          type: string
          example: SIN
        address:
          $ref: '#/components/schemas/Address'
        geoCode:
          $ref: '#/components/schemas/GeoCode'
        distance:
          type: object
          properties:
            value:
              type: number
              example: 0.9
            unit:
              type: string
              example: KM
        amenities:
          type: array
          items:
            type: string
          example: [SWIMMING_POOL, SPA, FITNESS_CENTER, WIFI]
        rating:
          type: string
          example: "5"
        lastUpdate:
          type: string
          format: date-time

    HotelListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HotelListEntry'
        meta:
          type: object
          properties:
            count:
              type: integer
              example: 5
            links:
              type: object
              properties:
                self:
                  type: string

    HotelRoomOffer:
      type: object
      properties:
        id:
          type: string
          example: OFF3F9A1B2C4D5E
        checkInDate:
          type: string
          format: date
          example: "2026-10-15"
        checkOutDate:
          type: string
          format: date
          example: "2026-10-18"
        rateCode:
          type: string
          example: RAC
        rateFamilyEstimated:
          type: object
          properties:
            code:
              type: string
              example: PRO
            type:
              type: string
              example: P
        category:
          type: string
          example: STANDARD
        description:
          type: object
          properties:
            lang:
              type: string
              example: EN
            text:
              type: string
              example: Deluxe Room with heritage courtyard view
        boardType:
          type: string
          example: ROOM_ONLY
        room:
          type: object
          properties:
            type:
              type: string
              example: DELUXE_ROOM
            typeEstimated:
              type: object
              properties:
                category:
                  type: string
                beds:
                  type: integer
                  example: 1
                bedType:
                  type: string
                  example: KING
            description:
              type: object
              properties:
                lang:
                  type: string
                text:
                  type: string
        guests:
          type: object
          properties:
            adults:
              type: integer
              example: 2
        price:
          type: object
          properties:
            currency:
              type: string
              example: USD
            base:
              type: string
              example: "1260.00"
            total:
              type: string
              example: "1373.40"
            taxes:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                    example: GST
                  amount:
                    type: string
                  currency:
                    type: string
                  percentage:
                    type: string
                    example: "9.0"
                  included:
                    type: boolean
                  description:
                    type: string
                  pricingFrequency:
                    type: string
                  pricingMode:
                    type: string
            variations:
              type: object
              properties:
                average:
                  type: object
                  properties:
                    base:
                      type: string
                changes:
                  type: array
                  items:
                    type: object
                    properties:
                      startDate:
                        type: string
                        format: date
                      endDate:
                        type: string
                        format: date
                      base:
                        type: string
        policies:
          type: object
          properties:
            cancellations:
              type: array
              items:
                type: object
                properties:
                  deadline:
                    type: string
                    format: date-time
                  description:
                    type: object
                    properties:
                      lang:
                        type: string
                      text:
                        type: string
            guarantee:
              type: object
              properties:
                acceptedPayments:
                  type: object
                  properties:
                    creditCards:
                      type: array
                      items:
                        type: string
                      example: [VI, MC, AX, DC]
                    methods:
                      type: array
                      items:
                        type: string
            paymentType:
              type: string
              example: GUARANTEE
        self:
          type: string

    HotelOffersEntry:
      type: object
      properties:
        type:
          type: string
          example: hotel-offers
        hotel:
          type: object
          properties:
            type:
              type: string
            hotelId:
              type: string
              example: ADSINFL1
            name:
              type: string
              example: THE FULLERTON HOTEL SINGAPORE
            cityCode:
              type: string
              example: SIN
            countryCode:
              type: string
              example: SG
            rating:
              type: string
              example: "5"
            address:
              $ref: '#/components/schemas/Address'
            amenities:
              type: array
              items:
                type: string
            geoCode:
              $ref: '#/components/schemas/GeoCode'
        available:
          type: boolean
          example: true
        offers:
          type: array
          items:
            $ref: '#/components/schemas/HotelRoomOffer'
        self:
          type: string

    HotelOffersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HotelOffersEntry'

    HotelGuest:
      type: object
      required: [tid, firstName, lastName, phone, email]
      properties:
        tid:
          type: integer
          description: Traveler ID (1-based index)
          example: 1
        title:
          type: string
          enum: [MR, MRS, MS, DR]
          example: MR
        firstName:
          type: string
          example: JOHN
        lastName:
          type: string
          example: DOE
        phone:
          type: string
          example: "+6591234567"
        email:
          type: string
          format: email
          example: john.doe@example.com

    HotelPayment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        method:
          type: string
          example: creditCard
        card:
          type: object
          properties:
            vendorCode:
              type: string
              example: VI
            cardNumber:
              type: string
              example: "4111111111111111"
            expiryDate:
              type: string
              example: "2028-01"

    HotelOrderRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [hotelOffers, guests, payments]
          properties:
            hotelOffers:
              type: array
              description: Hotel offer objects from /v3/shopping/hotel-offers
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: Hotel offer ID from search
                    example: OFF3F9A1B2C4D5E
            guests:
              type: array
              items:
                $ref: '#/components/schemas/HotelGuest'
            payments:
              type: array
              items:
                $ref: '#/components/schemas/HotelPayment'

    HotelOrderResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              example: hotel-order
            id:
              type: string
              example: HORDER3F9A1B2C
            hotelBookings:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: hotel-booking
                  id:
                    type: string
                    example: BKGABC12345
                  bookingStatus:
                    type: string
                    example: CONFIRMED
                  confRoomLists:
                    type: array
                    items:
                      type: object
                      properties:
                        confirmationId:
                          type: string
                          example: CONFABCDEF
                  hotelOffer:
                    type: object
                  hotel:
                    type: object
                  guests:
                    type: array
                    items:
                      $ref: '#/components/schemas/HotelGuest'
            associatedRecords:
              type: array
              items:
                type: object
                properties:
                  reference:
                    type: string
                    example: CONFABCDEF
                  originSystemCode:
                    type: string
                    example: GDS

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # --------------------------------------------------------------------------
  # Health
  # --------------------------------------------------------------------------
  /health:
    get:
      tags: [Health]
      summary: Service health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: amadeus-mock
                  version:
                    type: string
                    example: 1.0.0

  # --------------------------------------------------------------------------
  # Auth
  # --------------------------------------------------------------------------
  /v1/security/oauth2/token:
    post:
      tags: [Auth]
      summary: Get access token (OAuth2 client credentials)
      operationId: getToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, client_secret, grant_type]
              properties:
                client_id:
                  type: string
                  default: test
                  description: Application client ID (default `test`)
                client_secret:
                  type: string
                  default: test
                  description: Application client secret (default `test`)
                grant_type:
                  type: string
                  enum: [client_credentials]
                  default: client_credentials
            example:
              client_id: test
              client_secret: test
              grant_type: client_credentials
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                type: amadeusOAuth2Token
                username: ws-with-test@amadeus-mock
                application_name: AmadeusMock
                client_id: test
                token_type: Bearer
                access_token: AaxFD-Ih3Zs45vp_aS27nDdI90D6RF8iJqX9xku0oew
                expires_in: 1799
                state: approved
                scope: ""
        '400':
          description: Invalid grant type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --------------------------------------------------------------------------
  # Flight Offers Search
  # --------------------------------------------------------------------------
  /v2/shopping/flight-offers:
    get:
      tags: [Flights]
      summary: Search for available flights
      operationId: searchFlightOffers
      security:
        - BearerAuth: []
      parameters:
        - name: originLocationCode
          in: query
          required: true
          description: Origin airport IATA code
          schema:
            type: string
            example: SIN
        - name: destinationLocationCode
          in: query
          required: true
          description: Destination airport IATA code
          schema:
            type: string
            example: LHR
        - name: departureDate
          in: query
          required: true
          description: Departure date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-12-01"
        - name: adults
          in: query
          required: true
          description: Number of adult travelers (1–9)
          schema:
            type: integer
            minimum: 1
            maximum: 9
            example: 1
        - name: returnDate
          in: query
          required: false
          description: Return date for round-trip (YYYY-MM-DD). Omit for one-way.
          schema:
            type: string
            format: date
            example: "2026-12-15"
        - name: travelClass
          in: query
          required: false
          description: Filter by cabin class. Omit to return all classes.
          schema:
            type: string
            enum: [ECONOMY, PREMIUM_ECONOMY, BUSINESS, FIRST]
            example: ECONOMY
        - name: max
          in: query
          required: false
          description: Maximum number of offers to return (1–250)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 250
        - name: currencyCode
          in: query
          required: false
          description: Currency for prices (informational only, prices always USD)
          schema:
            type: string
            default: USD
            example: USD
      responses:
        '200':
          description: List of matching flight offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightSearchResponse'
              example:
                meta:
                  count: 2
                  links:
                    self: /v2/shopping/flight-offers?originLocationCode=SIN&destinationLocationCode=LHR&departureDate=2026-12-01&adults=1
                data:
                  - type: flight-offer
                    id: "1"
                    source: GDS
                    oneWay: true
                    numberOfBookableSeats: 9
                    price:
                      currency: USD
                      total: "1172.91"
                      grandTotal: "1172.91"
                    validatingAirlineCodes: [SQ]
                dictionaries:
                  carriers:
                    SQ: SINGAPORE AIRLINES
                  aircraft:
                    "359": AIRBUS A350-900
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --------------------------------------------------------------------------
  # Flight Order — Create
  # --------------------------------------------------------------------------
  /v1/booking/flight-orders:
    post:
      tags: [Flights]
      summary: Create a flight booking
      operationId: createFlightOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightOrderRequest'
            example:
              data:
                type: flight-order
                flightOffers:
                  - type: flight-offer
                    id: "1"
                    source: GDS
                    itineraries: []
                    price:
                      currency: USD
                      total: "1172.91"
                      grandTotal: "1172.91"
                    travelerPricings: []
                travelers:
                  - id: "1"
                    dateOfBirth: "1990-04-14"
                    name:
                      firstName: JOHN
                      lastName: DOE
                    gender: MALE
                    contact:
                      emailAddress: john.doe@example.com
                      phones:
                        - deviceType: MOBILE
                          countryCallingCode: "65"
                          number: "91234567"
                    documents:
                      - documentType: PASSPORT
                        number: A12345678
                        expiryDate: "2030-01-01"
                        issuanceCountry: SG
                        nationality: SG
                        holder: true
      responses:
        '201':
          description: Flight order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FlightOrder'
              example:
                data:
                  type: flight-order
                  id: MOCK3F9A1B2C
                  queuingOfficeId: SINBA2222
                  associatedRecords:
                    - reference: PNR4A2BCD
                      creationDate: "2026-08-20T10:00:00.000"
                      originSystemCode: GDS
                      flightOfferId: "1"
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --------------------------------------------------------------------------
  # Flight Order — Retrieve / Cancel
  # --------------------------------------------------------------------------
  /v1/booking/flight-orders/{orderId}:
    get:
      tags: [Flights]
      summary: Retrieve a flight order
      operationId: getFlightOrder
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            example: MOCK3F9A1B2C
      responses:
        '200':
          description: Flight order details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FlightOrder'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Flights]
      summary: Cancel (delete) a flight order
      operationId: cancelFlightOrder
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            example: MOCK3F9A1B2C
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                type: object
                example: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --------------------------------------------------------------------------
  # Hotel List by City
  # --------------------------------------------------------------------------
  /v1/reference-data/locations/hotels/by-city:
    get:
      tags: [Hotels]
      summary: List hotels in a city
      operationId: listHotelsByCity
      security:
        - BearerAuth: []
      parameters:
        - name: cityCode
          in: query
          required: true
          description: |
            City or airport IATA code. Supported codes:
            **SIN** (Singapore), **LON/LHR** (London), **NYC/JFK** (New York),
            **SYD** (Sydney), **DXB** (Dubai), **PAR/CDG** (Paris), **TYO/HND** (Tokyo)
          schema:
            type: string
            example: SIN
        - name: radius
          in: query
          required: false
          schema:
            type: integer
            default: 5
            minimum: 0
            maximum: 300
        - name: radiusUnit
          in: query
          required: false
          schema:
            type: string
            enum: [KM, MILE]
            default: KM
        - name: hotelSource
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, BEDBANK, DIRECTCHAIN]
            default: ALL
      responses:
        '200':
          description: List of hotels in the city
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelListResponse'
              example:
                data:
                  - type: hotel
                    hotelId: ADSINFL1
                    name: THE FULLERTON HOTEL SINGAPORE
                    cityCode: SIN
                    countryCode: SG
                    rating: "5"
                    amenities: [SWIMMING_POOL, SPA, FITNESS_CENTER, WIFI]
                meta:
                  count: 5
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --------------------------------------------------------------------------
  # Hotel Offers Search
  # --------------------------------------------------------------------------
  /v3/shopping/hotel-offers:
    get:
      tags: [Hotels]
      summary: Search room offers for specific hotels
      description: |
        Pass one or more `hotelId` values (comma-separated) from
        `/v1/reference-data/locations/hotels/by-city`. Returns room types,
        pricing, and cancellation policies for each hotel.
      operationId: searchHotelOffers
      security:
        - BearerAuth: []
      parameters:
        - name: hotelIds
          in: query
          required: true
          description: Comma-separated hotel IDs (e.g. `ADSINFL1,ADSINMA1`)
          schema:
            type: string
            example: ADSINFL1,ADSINMA1
        - name: adults
          in: query
          required: false
          description: Number of adult guests
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 9
            example: 2
        - name: checkInDate
          in: query
          required: true
          description: Check-in date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-12-15"
        - name: checkOutDate
          in: query
          required: true
          description: Check-out date (YYYY-MM-DD). Must be after checkInDate.
          schema:
            type: string
            format: date
            example: "2026-12-18"
        - name: roomQuantity
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 9
        - name: currency
          in: query
          required: false
          schema:
            type: string
            default: USD
      responses:
        '200':
          description: Room offers for each requested hotel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelOffersResponse'
              example:
                data:
                  - type: hotel-offers
                    hotel:
                      hotelId: ADSINFL1
                      name: THE FULLERTON HOTEL SINGAPORE
                      cityCode: SIN
                    available: true
                    offers:
                      - id: OFF3F9A1B2C4D5E
                        checkInDate: "2026-12-15"
                        checkOutDate: "2026-12-18"
                        room:
                          type: DELUXE_ROOM
                          typeEstimated:
                            beds: 1
                            bedType: KING
                        price:
                          currency: USD
                          base: "1260.00"
                          total: "1373.40"
        '400':
          description: Invalid date format or checkOutDate ≤ checkInDate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

