services:
  amadeus-mock:
    build: .
    image: amadeus-mock:latest
    container_name: amadeus-mock
    ports:
      - "8090:8090"
    environment:
      # --- Credentials ---
      # Change these to anything you like; your workshop apps must match.
      AMADEUS_CLIENT_ID: "test"
      AMADEUS_CLIENT_SECRET: "test"

      # --- Auth mode ---
      # Set to "false" to skip Bearer token checks entirely (fastest for demos)
      REQUIRE_AUTH: "true"

      # --- Static token ---
      # Accepted alongside OAuth-issued tokens, for clients without OAuth2
      # support (e.g. SAM Desktop API connectors: HTTP Basic/Bearer only).
      # Set to "" to require OAuth-issued tokens only.
      STATIC_BEARER_TOKEN: "workshop"

      # --- Token TTL ---
      TOKEN_TTL_SECONDS: "1799"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
